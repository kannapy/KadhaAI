
name: Build Kadha AI Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "KadhaAI_Full_Project.zip"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract project
        run: unzip -q KadhaAI_Full_Project.zip

      - name: Install dependencies
        working-directory: KadhaAI_Full_Project
        run: npm install --no-audit --no-fund

      - name: Build website
        working-directory: KadhaAI_Full_Project
        run: npm run build

      - name: Create Android project
        working-directory: KadhaAI_Full_Project
        run: |
          npx cap add android
          npx cap sync android

      - name: Build APK
        working-directory: KadhaAI_Full_Project/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KadhaAI-debug-apk
          path: KadhaAI_Full_Project/android/app/build/outputs/apk/debug/app-debug.apk
          
